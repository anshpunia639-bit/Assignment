<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
        <form action="#">
        <label for="name"></label>
        <input type="text" name="name" id="name" placeholder="Full Name">
        <br><br>
        <label for="email"></label>
        <input type="email" name="eamil" id="email" placeholder="you@college.edu">
        <br><br>
        <label for="mobile"></label>
        <input type="tel" name="mobile" id="mobile" placeholder="10-digit mobile">
        <br><br>
        <input type="password" name="password" id="password" minlength="6" placeholder="Min 6 characters">
        <br><br>
        <input type="number" name="number" id="number" min="17" max="35" placeholder="Age (17)">
        <br><br>
        <input type="submit" value="Register">
    </form>
    

</body>
</html>
